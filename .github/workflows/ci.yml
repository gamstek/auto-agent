name: validate
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm prepare:runtime
      - run: bun test tests/corax/runtime.test.ts -t packaged
        env:
          AUTO_AGENT_TEST_RUNTIME: desktop/src-tauri/runtime
  desktop:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
        working-directory: desktop
      - run: pnpm run test:desktop
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: pnpm --filter auto-agent-desktop run build:release
        env:
          AUTO_AGENT_UPDATER_PUBLIC_KEY: ${{ vars.AUTO_AGENT_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: pnpm test:installer
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - uses: actions/upload-artifact@v4
        with:
          name: auto-agent-Desktop-Windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            desktop/src-tauri/target/release/bundle/nsis/latest.json
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: auto-agent-Desktop-Windows-x64
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes "${flags[@]}"
          channel=stable
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then channel=beta; fi
          feed="desktop-$channel"
          gh release view "$feed" >/dev/null 2>&1 || gh release create "$feed" --target "$GITHUB_SHA" --prerelease --latest=false --title "Desktop $channel update feed" --notes "Signed desktop update manifest. Installers are attached to versioned releases."
          gh release upload "$feed" dist/latest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
