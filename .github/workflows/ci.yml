name: validate
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - if: runner.os == 'Windows'
        run: bun run build:windows
      - if: runner.os == 'Linux'
        run: bun run build:linux
      - run: bun test tests/integration/binary.test.ts tests/integration/wiki-index.test.ts tests/unit/sam.test.ts
        env:
          AUTO_AGENT_TEST_BINARY: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: auto-agent-${{ runner.os }}-x64
          path: dist/*
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: auto-agent-*-x64
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
