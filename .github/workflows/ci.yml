name: validate
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, development, start]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.suite == 'unit'
        run: pnpm prepare:host
      - if: matrix.suite != 'unit'
        run: bun test tests/corax/runtime.test.ts -t "native Corax ${{ matrix.suite }} "
      - if: matrix.suite == 'unit'
        run: pnpm run typecheck
      - if: matrix.suite == 'unit'
        run: bun test tests/corax -t '^(?!native Corax )'
      - if: matrix.suite == 'unit'
        run: node --import tsx --test tests/node/*.test.ts
      - if: matrix.suite == 'unit'
        run: pnpm -r --if-present run test
  packaged-runtime:
    # Preserve the deployed-runtime check on branch pushes without building an installer.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:runtime
      - run: bun test tests/corax/runtime.test.ts -t packaged
        env:
          AUTO_AGENT_TEST_RUNTIME: desktop/src-tauri/runtime
  ui:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
        working-directory: desktop
      - run: pnpm test:desktop
        env:
          PLAYWRIGHT_CHANNEL: chromium
  desktop:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm build:desktop
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 8
      - if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter auto-agent-desktop run build:release
        env:
          AUTO_AGENT_UPDATER_PUBLIC_KEY: ${{ vars.AUTO_AGENT_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: pnpm test:installer
      - uses: actions/upload-artifact@v4
        with:
          name: auto-agent-Desktop-Windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            desktop/src-tauri/target/release/bundle/nsis/latest.json
  macos:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, dmg: aarch64 }
          - { runner: macos-15-intel, arch: x64, dmg: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - if: ${{ !(startsWith(github.ref, 'refs/tags/v') && vars.AUTO_AGENT_RELEASE_MACOS == 'true') }}
        run: pnpm build:desktop
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 8
      - name: Build signed and notarized macOS release
        if: startsWith(github.ref, 'refs/tags/v') && vars.AUTO_AGENT_RELEASE_MACOS == 'true'
        run: bash .github/scripts/build-macos-release.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Verify the installed DMG layout and bundled Corax runtime
        env:
          DMG_ARCH: ${{ matrix.dmg }}
          APPLE_RELEASE_CHECK: ${{ startsWith(github.ref, 'refs/tags/v') && vars.AUTO_AGENT_RELEASE_MACOS == 'true' && '1' || '' }}
        run: bash .github/scripts/verify-macos-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: auto-agent-Desktop-macOS-${{ matrix.arch }}
          path: desktop/src-tauri/target/release/bundle/dmg/*_${{ matrix.dmg }}.dmg
          if-no-files-found: error
  release:
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.test.result == 'success' && needs.ui.result == 'success' && needs.desktop.result == 'success'
      && (vars.AUTO_AGENT_RELEASE_MACOS != 'true' || needs.macos.result == 'success') }}
    needs: [test, ui, desktop, macos]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: auto-agent-Desktop-Windows-x64
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: vars.AUTO_AGENT_RELEASE_MACOS == 'true'
        with:
          pattern: auto-agent-Desktop-macOS-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes "${flags[@]}"
          fi
          channel=stable
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then channel=beta; fi
          feed="desktop-$channel"
          gh release view "$feed" >/dev/null 2>&1 || gh release create "$feed" --target "$GITHUB_SHA" --prerelease --latest=false --title "Desktop $channel update feed" --notes "Signed desktop update manifest. Installers are attached to versioned releases."
          gh release upload "$feed" dist/latest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
