name: desktop-windows
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      [
        'desktop/**',
        'agent.ts',
        'instructions.ts',
        'sandbox.ts',
        'lib/**',
        'tools/**',
        'channels/**',
        'scripts/**',
        'skills/**',
        'resources/**',
        'package.json',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
        'packages/**',
        'tsconfig*.json',
        '.github/workflows/desktop.yml',
      ]
  pull_request:
    paths:
      [
        'desktop/**',
        'agent.ts',
        'instructions.ts',
        'sandbox.ts',
        'lib/**',
        'tools/**',
        'channels/**',
        'scripts/**',
        'skills/**',
        'resources/**',
        'package.json',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
        'packages/**',
        'tsconfig*.json',
        '.github/workflows/desktop.yml',
      ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm --filter auto-agent-desktop run prepare:runtime
      - run: pnpm --filter auto-agent-desktop run build
      - run: pnpm exec playwright install chromium
        working-directory: desktop
      - run: pnpm --filter auto-agent-desktop run test:ui
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - run: pnpm run build:desktop
      - run: pnpm test:installer
      - uses: actions/upload-artifact@v4
        with:
          name: auto-agent-desktop-windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
